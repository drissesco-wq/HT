<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halifax Transit • Live Departures</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
    body { font-family: 'VT323', monospace; }
    .board { background: #111827; color: #22c55e; }
    .led { text-shadow: 0 0 10px #22c55e; }
  </style>
</head>
<body class="board min-h-screen p-4">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6 border-b border-green-500 pb-4">
      <div>
        <h1 class="text-5xl font-bold led">HALIFAX TRANSIT</h1>
        <p class="text-green-400 text-xl">LIVE DEPARTURES • REAL-TIME</p>
      </div>
      <div class="text-right">
        <div id="last-updated" class="text-green-400 text-lg">Last updated: just now</div>
        <div class="text-xs text-green-600">Stop #<span id="stop-number-display" class="font-bold">1234</span></div>
      </div>
    </div>

    <!-- Stop Input -->
    <div class="flex gap-3 mb-8">
      <input id="stop-input" 
             type="text" 
             placeholder="Enter 4-digit stop number (e.g. 1234)"
             class="flex-1 bg-gray-900 text-green-400 border border-green-500 rounded px-4 py-3 text-2xl focus:outline-none focus:border-green-300">
      <button onclick="getDepartures()" 
              class="bg-green-600 hover:bg-green-500 px-8 rounded text-white text-2xl font-bold">GET</button>
    </div>

    <!-- Service Alert -->
    <div id="alert-banner" class="hidden bg-yellow-900 border border-yellow-400 text-yellow-200 p-4 rounded mb-6 text-center text-xl">
      🚨 Service Alert: Route 7 delayed due to construction on Barrington St.
    </div>

    <!-- Departures Table -->
    <div class="bg-gray-950 rounded border border-green-600 overflow-hidden">
      <table class="w-full text-left">
        <thead>
          <tr class="bg-gray-900 text-green-300 text-xl border-b border-green-600">
            <th class="p-4">ROUTE</th>
            <th class="p-4">DESTINATION</th>
            <th class="p-4 text-right">DUE</th>
            <th class="p-4">STATUS</th>
          </tr>
        </thead>
        <tbody id="departures-body" class="text-2xl"></tbody>
      </table>
    </div>

    <div class="text-center text-green-600 text-sm mt-8">
      Auto-refresh every 20 seconds • Data from Halifax Transit GTFS-RT
    </div>
  </div>

  <script>
    // Mock Halifax data (realistic routes & stops)
    let mockData = [
      { route: "1", destination: "Spring Garden & Barrington", due: "3 min", status: "On time" },
      { route: "2", destination: "Mumford Terminal", due: "8 min", status: "On time" },
      { route: "7", destination: "Bayers Lake", due: "12 min", status: "Delayed" },
      { route: "9", destination: "Dartmouth Bridge Terminal", due: "1 min", status: "Arriving" },
      { route: "10", destination: "Mic Mac Mall", due: "22 min", status: "On time" }
    ];

    function renderDepartures(data) {
      const tbody = document.getElementById('departures-body');
      tbody.innerHTML = '';
      
      data.forEach(item => {
        const row = document.createElement('tr');
        row.className = 'border-b border-green-900 hover:bg-gray-900';
        row.innerHTML = `
          <td class="p-4 font-bold">${item.route}</td>
          <td class="p-4">${item.destination}</td>
          <td class="p-4 text-right font-bold">${item.due}</td>
          <td class="p-4">
            <span class="px-3 py-1 rounded text-sm ${item.status === 'On time' ? 'bg-green-600' : item.status === 'Delayed' ? 'bg-red-600' : 'bg-yellow-600'} text-white">
              ${item.status}
            </span>
          </td>
        `;
        tbody.appendChild(row);
      });
      
      // Update timestamp
      document.getElementById('last-updated').textContent = `Last updated: ${new Date().toLocaleTimeString('en-CA', {hour:'numeric', minute:'2-digit'})}`;
    }

    // Fake live refresh
    function liveRefresh() {
      // Slightly randomize times so it feels live
      const updatedData = mockData.map(bus => {
        let mins = parseInt(bus.due);
        if (mins > 1) mins = Math.max(1, mins - Math.floor(Math.random()*2));
        return { ...bus, due: mins + " min" };
      });
      renderDepartures(updatedData);
    }

    window.getDepartures = function() {
      const input = document.getElementById('stop-input').value.trim() || "1234";
      document.getElementById('stop-number-display').textContent = input;
      
      // Show different data based on stop number (demo)
      if (input === "5678") {
        mockData = [
          { route: "3", destination: "Clayton Park", due: "5 min", status: "On time" },
          { route: "4", destination: "Fairview", due: "9 min", status: "On time" }
        ];
      } else if (input === "9999") {
        mockData = [{ route: "—", destination: "No buses scheduled", due: "—", status: "—"}];
      }
      
      renderDepartures(mockData);
      
      // Show random alert
      if (Math.random() > 0.7) {
        document.getElementById('alert-banner').classList.remove('hidden');
      } else {
        document.getElementById('alert-banner').classList.add('hidden');
      }
    };

    // Auto-refresh every 20 seconds
    setInterval(() => {
      if (document.getElementById('departures-body').children.length > 0) {
        liveRefresh();
      }
    }, 20000);

    // Load default stop on page load
    window.onload = () => {
      document.getElementById('stop-input').value = "1234";
      getDepartures();
    };
  </script>
</body>
</html>
